name: Actualizar README

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar estadísticas
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python3 .github/scripts/update_readme.py
      - name: Guardar cambios
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizar estadísticas del README"
          git push
